      function drawFilmGrain(time) {
        if (!noisePattern) return;
        ctx.save();
        ctx.globalCompositeOperation = "soft-light";
        ctx.globalAlpha = isStill ? 0.065 : 0.045 + Math.sin(time * 9.1) * 0.009;
        const shiftX = Math.floor(Math.sin(time * 0.7) * 80);
        const shiftY = Math.floor(Math.cos(time * 0.61) * 55);
        ctx.translate(shiftX, shiftY);
        ctx.fillStyle = noisePattern;
        ctx.fillRect(-shiftX - 100, -shiftY - 100, W + 200, H + 200);
        ctx.restore();
      }

      function drawSceneBloom() {
        if (!bloomPen || bloomCanvas.width < 2) return;
        bloomPen.setTransform(1, 0, 0, 1, 0, 0);
        bloomPen.filter = "blur(3.4px) saturate(1.15)";
        bloomPen.drawImage(canvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
        bloomPen.filter = "none";
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.2;
        ctx.drawImage(bloomCanvas, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function render(time) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#03050b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        applySceneTransform();

        ctx.save();
        const camera = cameraTransform(time);
        const pointerScale = 1 + pointer.sy * 0.0014;
        ctx.translate(W / 2 + camera.x, H / 2 + camera.y);
        ctx.scale(camera.scale * pointerScale, camera.scale * pointerScale);
        ctx.translate(-W / 2, -H / 2);

        drawSky(time);
        drawSearchLights(time);
        drawCityLayers(time);
        drawCityDepthAtmosphere(time);
        drawSkyInfrastructure(time);
        drawDistantTraffic(time);
        drawMaglev(time);
        drawSkyTraffic(time);
        drawSkyCruiser(time);
        drawSteam(time);
        drawAirMotes(time);
        drawDrone(time, 1150 + Math.sin(time * 0.035) * 210, 126 + Math.sin(time * 0.21) * 8, 0.4);
        drawDrone(time, 184 + Math.sin(time * 0.024 + 2) * 145, 573 + Math.sin(time * 0.18 + 2) * 4, 2.1);
        drawSelectedFishMarker(time);
        drawUnderBridge(time);
        drawFishLayer(time);
        drawBridgeBack(time);
        drawBridgeDeck(time);
        drawBridgeLighting(time);
        drawDeckRainImpacts(time);
        drawHoloReflection(time);
        drawSpinnerVehicle(time);

        const ambientFish = fishSchool[0];
        const interactionFish = selectedFish >= 0 ? fishSchool[selectedFish] : ambientFish;
        const ambientNose = fishNose(ambientFish.state);
        const ambientHand = { x: 776, y: 544 };
        const selectedNose = selectedFish >= 0 ? fishNose(interactionFish.state) : ambientNose;
        const selectedDistance = Math.hypot(selectedNose.x - ambientHand.x, selectedNose.y - ambientHand.y);
        const selectedProximity = clamp(1 - selectedDistance / 220, 0, 1);
        const contactIntensity = selectedFish >= 0
          ? clamp(interactionFish.arrival * (0.62 + Math.sin(time * 1.3) * 0.12) + energy * 0.35, 0, 1.4) * selectedProximity
          : 0;
        const fishApproachRaise =
          selectedFish >= 0 ? smoothstep(620, 210, selectedDistance) : 0;
        const nearestUnclickedDistance =
          selectedFish >= 0
            ? Infinity
            : Math.min(
                ...fishSchool.map((fish) => {
                  const nose = fishNose(fish.state);
                  return Math.hypot(nose.x - ambientHand.x, nose.y - ambientHand.y);
                })
              );
        const idleRaiseGate =
          selectedFish >= 0 ? 0 : smoothstep(260, 420, nearestUnclickedDistance);
        const armRaise = Math.max(
          idleHandRaise(time) * idleRaiseGate,
          fishApproachRaise
        );
        currentArmRaise = armRaise;
        const hand = drawWomanBack(time, contactIntensity, armRaise);
        if (contactIntensity > 0.012) {
          drawContact(time, hand, contactIntensity, interactionFish);
        }

        drawAtmosphere(time);
        drawRain(time);
        drawLensDrops(time);
        drawForegroundCables(time);
        drawFilmGrain(time);
        ctx.restore();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        drawSceneBloom();
      }

      function screenToFish(clientX, clientY) {
        const point = toScene(clientX, clientY);
        let result = -1;
        let bestScore = Infinity;

        for (const fish of fishSchool) {
          const dx = point.x - fish.state.x;
          const dy = point.y - fish.state.y;
          const cos = Math.cos(-fish.state.rot);
          const sin = Math.sin(-fish.state.rot);
          const localX = (dx * cos - dy * sin) / fish.state.scale;
          const localY = (dx * sin + dy * cos) / fish.state.scale;
          const tailIncluded = localX >= 235 && localX <= 670 && localY > -245 && localY < 235;
          const insideBody = Math.pow((localX + 80) / 340, 2) + Math.pow(localY / 168, 2) < 1;
          if (!insideBody && !tailIncluded) continue;
          const score = Math.hypot(localX + 80, localY) * fish.state.scale;
          if (score < bestScore) {
            bestScore = score;
            result = fish.index;
          }
        }
        return result;
      }

      function updatePointerFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.clientX - rect.left;
        const clientY = event.clientY - rect.top;
        pointer.x = clientX;
        pointer.y = clientY;
        pointer.nx = (clientX / Math.max(1, rect.width)) * 2 - 1;
        pointer.ny = (clientY / Math.max(1, rect.height)) * 2 - 1;
        pointer.inside = true;
        pointer.fishIndex = screenToFish(clientX, clientY);
        pointer.hovering = pointer.fishIndex >= 0;
        canvas.classList.toggle("is-hovering", pointer.hovering);
      }

      function selectFish(index) {
        if (index < 0 || index >= fishSchool.length) return;
        const previous = selectedFish;
        const fish = fishSchool[index];
        selectedFish = index;
        lastUserActionAt = elapsed;
        fish.arrival = 0;
        fish.trail.length = 0;

        // The hero fish may only enter the interaction from the right. If the
        // clicked fish is already left of the raised hand, its hologram
        // re-forms just beyond the hand and keeps swimming left from there.
        const anchor = heroAnchorForLayout();
        if (fish.state.x < anchor.x) {
          fish.state.x = anchor.x + 520 * anchor.scale;
          fish.entryFade = 0;
        } else {
          fish.entryFade = 1;
        }

        energy = Math.max(energy, 0.8);
        queueMemory();

        if (previous >= 0 && previous !== index) {
          const released = fishSchool[previous];
          alignLanePhaseToCurrentState(released, elapsed);
          released.arrival = 0;
        }
      }

      function triggerPulse() {
        energy = 1;
        lastUserActionAt = elapsed;
        if (selectedFish >= 0) {
          const fish = fishSchool[selectedFish];
          fish.trail.push({
            x: fish.state.x,
            y: fish.state.y,
            rot: fish.state.rot,
            scale: fish.state.scale,
            age: 0
          });
          if (pendingMemoryIndex >= 0) revealMemory();
        }
      }

      function handlePointerMove(event) {
        updatePointerFromEvent(event);
      }

      function handlePointerLeave() {
        pointer.hovering = false;
        pointer.inside = false;
        pointer.fishIndex = -1;
        canvas.classList.remove("is-hovering");
      }

      function handlePointerDown(event) {
        ensureAmbientAudio();
        updatePointerFromEvent(event);
        const index = pointer.fishIndex;
        if (index >= 0) {
          selectFish(index);
        } else {
          triggerPulse();
        }
      }

      function handleKeyDown(event) {
        if (event.code === "Space") {
          event.preventDefault();
          ensureAmbientAudio();
          triggerPulse();
        } else if (event.key.toLowerCase() === "p") {
          paused = !paused;
          lastFrame = performance.now();
        } else if (event.key.toLowerCase() === "f") {
          if (document.fullscreenElement) {
            document.exitFullscreen?.();
          } else {
            document.documentElement.requestFullscreen?.();
          }
        }
      }

      function positionMemory() {
        if (!memoryShown || selectedFish < 0) return;
        const fish = fishSchool[selectedFish];
        const stageRect = stage.getBoundingClientRect();
        const fishBodyWidth = 660 * fish.state.scale * viewScale;
        const width = clamp(Math.min(600, fishBodyWidth * 1.4, stageRect.width * 0.66), 92, 600);
        const fontSize = clamp(width * 0.064, 6.8, 15.5);
        memoryPanel.style.width = `${width.toFixed(1)}px`;
        memoryPanel.style.fontSize = `${fontSize.toFixed(1)}px`;
        const height = memoryPanel.offsetHeight || 140;
        const margin = 16;
        const driftX = Math.sin(elapsed * 0.32) * 3;
        const driftY = Math.cos(elapsed * 0.27) * 2;
        const bodyCenterX = fish.state.x - 82 * fish.state.scale;
        const bodyCenterY = fish.state.y - 2 * fish.state.scale;
        const camera = cameraTransform(elapsed);
        const cameraX =
          W / 2 + camera.x + (bodyCenterX - W / 2) * camera.scale;
        const cameraY =
          H / 2 + camera.y + (bodyCenterY - H / 2) * camera.scale;
        let x = viewOffsetX + cameraX * viewScale + driftX;
        let y = viewOffsetY + cameraY * viewScale + driftY;
        x = clamp(x, margin + width / 2, stageRect.width - margin - width / 2);
        y = clamp(y, margin + height / 2, stageRect.height - margin - height / 2);
        memoryPanel.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      }

      window.__neonTide = {
        version: 18,
        bodyProfile: () => {
          const probe = document.createElement("canvas");
          probe.width = 700;
          probe.height = 400;
          const pen = probe.getContext("2d");
          pen.translate(420, 200);
          bodyPath(pen);
          pen.fillStyle = "#ffffff";
          pen.fill();
          const image = pen.getImageData(0, 0, probe.width, probe.height);
          let topPeak = { x: 0, y: 0 };
          let bottomPeak = { x: 0, y: 0 };
          for (let x = -414; x <= 258; x += 3) {
            let top = null;
            let bottom = null;
            for (let y = -190; y <= 175; y++) {
              const pixelX = 420 + x;
              const pixelY = 200 + y;
              if (image.data[(pixelY * probe.width + pixelX) * 4 + 3] > 0) {
                top = y;
                break;
              }
            }
            for (let y = 175; y >= -190; y--) {
              const pixelX = 420 + x;
              const pixelY = 200 + y;
              if (image.data[(pixelY * probe.width + pixelX) * 4 + 3] > 0) {
                bottom = y;
                break;
              }
            }
            if (top !== null && (topPeak.y === 0 || top < topPeak.y)) topPeak = { x, y: top };
            if (bottom !== null && (bottomPeak.y === 0 || bottom > bottomPeak.y)) bottomPeak = { x, y: bottom };
          }
          return { topPeak, bottomPeak };
        },
        snapshot: () =>
          fishSchool.map((fish) => ({
            index: fish.index,
            x: Number(fish.state.x.toFixed(2)),
            y: Number(fish.state.y.toFixed(2)),
            scale: Number(fish.state.scale.toFixed(3)),
            rot: Number(fish.state.rot.toFixed(3)),
            direction: fish.direction,
            speed: fish.speed,
            entryFade: Number(fish.entryFade.toFixed(3)),
            hologramAlpha: Number(fishHologramFlicker(fish, elapsed).toFixed(3)),
            selected: fish.index === selectedFish
          })),
        selectFish: (index) => selectFish(index),
        previewCapture: {
          pause() {
            paused = true;
            lastFrame = performance.now();
          },
          step(seconds = 0.1) {
            const delta = clamp(seconds, 0.001, 0.25);
            elapsed += delta;
            updateFish(delta, elapsed);
            render(elapsed);
            positionMemory();
          }
        },
        state: () => ({
          portraitMode,
          viewScale,
          viewOffsetX,
          viewOffsetY,
          stageWidth: stage.clientWidth,
          stageHeight: stage.clientHeight,
          armRaise: Number(currentArmRaise.toFixed(3)),
          idleArmRaise: Number(idleHandRaise(elapsed).toFixed(3)),
          cameraScale: Number(cameraTransform(elapsed).scale.toFixed(6)),
          audioEnabled,
          audioState: audioContext ? audioContext.state : "off",
          fishRenderer: fish3D ? "webgl" : "canvas2d",
          fishResolution: fish3D
            ? `${fish3D.canvas.width}x${fish3D.canvas.height}`
            : `${W}x${H}`,
          selectedFish,
          memoryShown,
          memoryVisibleClass: memoryPanel.classList.contains("is-visible"),
          memoryWidth: memoryPanel.style.width,
          memoryFontSize: memoryPanel.style.fontSize
        })
      };

      function animate(now) {
        const delta = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
        lastFrame = now;
        if (!paused) {
          elapsed += delta;
          updateFish(delta, elapsed);
          pointer.sx = lerp(pointer.sx, pointer.nx, 1 - Math.exp(-delta * 4.6));
          pointer.sy = lerp(pointer.sy, pointer.ny, 1 - Math.exp(-delta * 4.6));
        }
        render(elapsed);
        positionMemory();
        if (!isStill) requestAnimationFrame(animate);
      }

      resize();
      if (isStill) {
        for (let settle = 0; settle < 160; settle++) {
          updateFish(1 / 60, elapsed);
        }
      } else {
        updateFish(0.016, elapsed);
      }
      render(elapsed);

      if (!isStill) {
        window.addEventListener("resize", resize);
        canvas.addEventListener("pointermove", handlePointerMove, { passive: true });
        canvas.addEventListener("pointerleave", handlePointerLeave, { passive: true });
        canvas.addEventListener("pointerdown", handlePointerDown);
        window.addEventListener("keydown", handleKeyDown);
        document.addEventListener("visibilitychange", () => {
          lastFrame = performance.now();
          if (audioContext && audioContext.state !== "closed") {
            if (document.hidden) {
              audioContext.suspend().catch(() => {});
            } else if (audioEnabled) {
              audioContext.resume().catch(() => {});
            }
          }
        });
        requestAnimationFrame(animate);
      } else {
        drawSelectedFishMarker(elapsed);
      }
    })();
  </script>
</body>
</html>
